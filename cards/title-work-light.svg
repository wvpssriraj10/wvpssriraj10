<svg xmlns="http://www.w3.org/2000/svg" width="880" height="84" viewBox="0 0 880 84" role="img" aria-label="Featured work"><title>Featured work</title><style>text{font-kerning:normal}@font-face{font-family:'SR display';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}.display{font-family:'SR display',Georgia,serif;font-weight:400;font-style:normal}@font-face{font-family:'SR displayi';font-weight:400;font-style:italic;src:url(data:font/woff;base64,) format('woff')}.displayi{font-family:'SR displayi',Georgia,serif;font-weight:400;font-style:italic}.body{font-family:'SR body',system-ui,sans-serif;font-weight:400;font-style:normal}.bodyb{font-family:'SR bodyb',system-ui,sans-serif;font-weight:600;font-style:normal}.mono{font-family:'SR mono',ui-monospace,Menlo,Consolas,monospace;font-weight:400;font-style:normal}
