<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="270" height="112" viewBox="0 0 270 112" role="img" aria-label="Portfolio: Projects and internships"><title>Portfolio: Projects and internships</title><style>text{font-kerning:normal}@font-face{font-family:'SR display';font-weight:700;src:url(data:font/woff;base64,) format('woff')}.display{font-family:'SR display',system-ui,sans-serif;font-weight:700}@font-face{font-family:'SR body';font-weight:400;src:url(data:font/woff;base64,) format('woff')}.body{font-family:'SR body',system-ui,sans-serif;font-weight:400}.mono{font-family:'SR mono',ui-monospace,Menlo,Consolas,monospace;font-weight:500}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes sweep{from{transform:scaleX(0)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes draw{from{stroke-dashoffset:var(--len)}}
.rise,.fade,.grow,.sweep,.pop,.draw{animation-duration:.8s;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-fill-mode:both;animation-delay:var(--d,0s)}
.rise{animation-name:rise}
.fade{animation-name:fade;animation-duration:.5s}
.grow{animation-name:grow;transform-box:fill-box;transform-origin:50% 100%}
.sweep{animation-name:sweep;transform-box:fill-box;transform-origin:0 50%}
.pop{animation-name:pop;transform-box:fill-box;transform-origin:50% 50%}
.draw{animation-name:draw;animation-duration:1.4s;stroke-dasharray:var(--len)}
.still{display:none}
@media (prefers-reduced-motion:reduce){
*{animation:none!important;transition:none!important}
.smil{display:none}
.still{display:inline}
}
